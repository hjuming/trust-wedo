name: Deploy Landing Page to Cloudflare Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      deployments: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'apps/landing/package-lock.json'
    
    - name: Install dependencies
      working-directory: apps/landing
      run: npm ci
    
    - name: Build application
      working-directory: apps/landing
      run: npm run build
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_API_URL: ${{ secrets.VITE_API_URL }}
    
    - name: Check Cloudflare deploy secrets
      id: deploy-secrets
      run: |
        if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    - name: Deploy to Cloudflare Pages
      if: steps.deploy-secrets.outputs.available == 'true'
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: pages deploy dist --project-name=trust-wedo
      env:
        WRANGLER_WORKING_DIRECTORY: apps/landing

    - name: Skip Cloudflare Pages deploy
      if: steps.deploy-secrets.outputs.available != 'true'
      run: echo "Cloudflare deploy secrets are not configured; relying on Cloudflare Pages Git integration."
