  <rect x="0" y="568" width="1200" height="72" fill="url(#floor)" opacity="0.96"/>
  <text x="72" y="613" fill="#fffaf1" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="25" font-weight="900" letter-spacing="1.5">BOOK WEDO FIELD MAP</text>
  <text x="1128" y="613" fill="#fffaf1" text-anchor="end" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="24" font-weight="900">7-11 書香門市</text>
