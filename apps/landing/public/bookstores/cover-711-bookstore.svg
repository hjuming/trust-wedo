      <path d="M42 76c54-38 138-38 192 0" fill="none" stroke="#345f7d" stroke-width="14" stroke-linecap="round"/>
      <circle cx="128" cy="74" r="28" fill="#f4b743" stroke="#fffaf1" stroke-width="8"/>
