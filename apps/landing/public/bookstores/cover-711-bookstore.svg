<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">7-ELEVEN 博客來書香門市代表圖</title>
  <desc id="desc">暖色便利商店取書櫃與書本插畫，代表 7-ELEVEN 與博客來合作的書香取書門市。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ea"/>
      <stop offset="0.5" stop-color="#e8efdf"/>
      <stop offset="1" stop-color="#cbd8cb"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2f684f"/>
      <stop offset="0.52" stop-color="#345f7d"/>
      <stop offset="1" stop-color="#b77738"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1f2c25" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>
  <circle cx="106" cy="96" r="128" fill="#fffaf1" opacity="0.72"/>
  <circle cx="1042" cy="126" r="154" fill="#fffaf1" opacity="0.54"/>
  <circle cx="1008" cy="500" r="190" fill="#2f684f" opacity="0.08"/>

  <g transform="translate(118 86)">
    <rect x="0" y="0" width="964" height="444" rx="42" fill="#fffaf1" filter="url(#shadow)"/>
    <rect x="0" y="0" width="964" height="74" rx="42" fill="#2f684f"/>
    <path d="M42 0h880a42 42 0 0 1 42 42v32H0V42A42 42 0 0 1 42 0Z" fill="#2f684f"/>
    <rect x="0" y="52" width="964" height="10" fill="#ee6f3b"/>
    <rect x="0" y="66" width="964" height="10" fill="#f4b743"/>

    <g transform="translate(48 104)">
      <text x="0" y="0" fill="#2f684f" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="26" font-weight="800" letter-spacing="3">7-ELEVEN × BOOKS.COM.TW</text>
      <text x="0" y="46" fill="#24322b" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="58" font-weight="900">書香取書門市</text>
      <text x="4" y="90" fill="#6f5f4d" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="25" font-weight="700">快速取書 · 便利購書 · 鄰近閱讀補給點</text>
    </g>

    <g transform="translate(646 116)">
      <rect x="0" y="0" width="230" height="248" rx="30" fill="#e7efe6" stroke="#d8c8b2" stroke-width="4"/>
      <rect x="28" y="34" width="174" height="48" rx="14" fill="#2f684f"/>
      <text x="115" y="66" fill="#fffaf1" text-anchor="middle" font-family="Arial, 'Noto Sans TC', sans-serif" font-size="22" font-weight="900">PICK UP</text>
      <g fill="#fffaf1" stroke="#d8c8b2" stroke-width="3">
        <rect x="28" y="106" width="48" height="48" rx="10"/>
        <rect x="91" y="106" width="48" height="48" rx="10"/>
        <rect x="154" y="106" width="48" height="48" rx="10"/>
        <rect x="28" y="169" width="48" height="48" rx="10"/>
        <rect x="91" y="169" width="48" height="48" rx="10"/>
        <rect x="154" y="169" width="48" height="48" rx="10"/>
      </g>
      <circle cx="179" cy="58" r="8" fill="#f4b743"/>
    </g>

    <g transform="translate(104 288)">
      <rect x="0" y="14" width="118" height="84" rx="14" fill="#345f7d"/>
      <rect x="18" y="0" width="118" height="98" rx="14" fill="#b77738"/>
      <rect x="40" y="20" width="58" height="10" rx="5" fill="#fffaf1" opacity="0.8"/>
      <rect x="40" y="42" width="76" height="9" rx="4.5" fill="#fffaf1" opacity="0.58"/>
      <rect x="40" y="62" width="62" height="9" rx="4.5" fill="#fffaf1" opacity="0.58"/>
      <path d="M156 8h112a26 26 0 0 1 26 26v64H182a26 26 0 0 1-26-26Z" fill="#fffaf1" stroke="#2f684f" stroke-width="5"/>
      <path d="M182 36h82M182 62h66" stroke="#2f684f" stroke-width="10" stroke-linecap="round"/>
